name: elm-${DEPLOY_ENV:?Set DEPLOY_ENV to test staging or production}
x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:?Set NODE_ENV}
  HOST: 0.0.0.0
  PORT: 3000
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
  PGHOST: db
  PGPORT: 5432
  PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
  PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: ${API_IMAGE:-elm-api:local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: *api-environment
    command: [node, backend/src/db-cli.js, migrate]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    image: ${API_IMAGE:-elm-api:local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
  web:
    image: ${WEB_IMAGE:-elm-web:local}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
